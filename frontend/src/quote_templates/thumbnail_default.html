<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1280px;
      height: 720px;
      background: radial-gradient(circle at 85% 20%, {{BRAND_COLOR}} 0%, rgba(0,0,0,0) 45%),
                  linear-gradient(160deg, #0b0b12 0%, #151528 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'DejaVu Sans', sans-serif;
      color: #ffffff;
      position: relative;
      overflow: hidden;
      padding: 72px 80px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .bar {
      position: absolute;
      left: 0;
      top: 0;
      width: 14px;
      height: 100%;
      background: {{BRAND_COLOR}};
    }
    .top {
      position: absolute;
      top: 56px;
      left: 80px;
      right: 80px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .logo {
      max-height: 64px;
      max-width: 200px;
      object-fit: contain;
    }
    .brand {
      font-size: 22px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      font-weight: 600;
    }
    .title {
      font-size: {{TITLE_SIZE}}px;
      line-height: 1.08;
      font-weight: 800;
      letter-spacing: -0.03em;
      max-width: 1000px;
      word-break: break-word;
      text-shadow: 0 4px 24px rgba(0,0,0,0.45);
    }
    .hook {
      margin-top: 24px;
      font-size: 30px;
      line-height: 1.35;
      color: rgba(255,255,255,0.82);
      max-width: 900px;
    }
    .badge {
      position: absolute;
      right: 80px;
      bottom: 72px;
      background: {{BRAND_COLOR}};
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      padding: 12px 22px;
      border-radius: 999px;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="bar"></div>
  <div class="top">
    {{LOGO_IMG}}
    <div class="brand">{{PODCAST_NAME}}</div>
  </div>
  <div class="title">{{TITLE}}</div>
  <div class="hook">{{HOOK}}</div>
  <div class="badge">NEW EPISODE</div>
</body>
</html>
